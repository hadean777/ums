<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="centered-body">
<div class="container">
    <h2>Reset Password</h2>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}"/>
        <div class="form-group">
            <label>New Password:</label>
            <input type="password" name="password" required/>
        </div>
        <div class="form-group">
            <label>Confirm Password:</label>
            <input type="password" name="confirmPassword" required/>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn-pill" style="background: #4CAF50; color: white;">Update Password</button>
        </div>
    </form>
    <p style="margin-top: 1rem;"><a th:href="@{/login}">Back to Login</a></p>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Main</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container" style="max-width: 90%; margin: 2rem auto;">
    <h1>Main Screen</h1>
    
    <div th:if="${isAdmin}">
        <h2>User Management</h2>
        <a th:href="@{/user/create}" class="btn-pill" style="display: inline-block; margin-bottom: 1rem; background: #4CAF50; color: white; text-decoration: none;">Create New User</a>
        
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 1rem;">
            <thead>
                <tr style="background-color: #f2f2f2;">
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">ID</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Login</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Role</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Enabled</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users.content}">
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${u.id}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${u.login}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${u.authRole}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${u.enabled}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;">
                        <a th:href="@{/user/edit/{id}(id=${u.id})}" class="btn-pill" style="display: inline-block; background: #2196F3; color: white; text-decoration: none; padding: 0.3rem 0.8rem; font-size: 0.9rem; margin-top: 0;">Edit</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <!-- Pagination -->
        <div th:if="${users.totalPages > 1}">
            <span th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
                <a th:href="@{/main(page=${i})}" th:text="${i + 1}" 
                   th:style="${users.number == i} ? 'font-weight: bold; margin: 0 5px;' : 'margin: 0 5px;'"></a>
            </span>
        </div>
    </div>

    <div th:unless="${isAdmin}">
        <p>You are authenticated.</p>

        <h2>Your Devices</h2>
        <form th:action="@{/device/create}" method="post">
            <button type="submit" class="btn-pill" style="background: #4CAF50; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer;">New Device</button>
        </form>

        <table th:if="${devices != null && !devices.isEmpty()}" style="width: 100%; border-collapse: collapse; margin-top: 1rem;">
            <thead>
                <tr style="background-color: #f2f2f2;">
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">ID</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Description</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">IP Address</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Expires At</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Enabled</th>
                    <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${devices}">
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${d.id}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${d.description}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${d.ipAddress}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${#dates.format(d.expiresAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;" th:text="${d.enabled}"></td>
                    <td style="border: 1px solid #ddd; padding: 8px;">
                        <a th:href="@{/device/edit/{id}(id=${d.id})}" class="btn-pill" style="display: inline-block; background: #2196F3; color: white; text-decoration: none; padding: 0.3rem 0.8rem; font-size: 0.9rem; margin-top: 0;">Edit</a>
                        
                        <div style="display: inline-block; position: relative;" class="dropdown">
                            <button class="btn-pill" style="display: inline-block; background: #4CAF50; color: white; border: none; padding: 0.3rem 0.8rem; font-size: 0.9rem; margin-top: 0; margin-left: 5px; cursor: pointer;">Config</button>
                            <div class="dropdown-content" style="display: none; position: absolute; background-color: #f9f9f9; min-width: 120px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1;">
                                <a th:href="@{/device/config/{id}(id=${d.id})}" style="color: black; padding: 12px 16px; text-decoration: none; display: block;">File</a>
                                <a href="#" th:onclick="'showQRCode(' + ${d.id} + ')'" style="color: black; padding: 12px 16px; text-decoration: none; display: block;">QR Code</a>
                            </div>
                        </div>

                        <form th:action="@{/device/delete/{id}(id=${d.id})}" method="post" style="display: inline-block; margin-left: 5px;" onsubmit="return confirm('Are you sure you want to delete this device?');">
                            <button type="submit" class="btn-pill" style="background: #ff4d4d; color: white; border: none; padding: 0.3rem 0.8rem; font-size: 0.9rem; cursor: pointer;">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${devices == null || devices.isEmpty()}">No devices found.</p>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9);">
        <span onclick="closeModal()" style="position: absolute; top: 15px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer;">&times;</span>
        <div style="margin: auto; display: block; width: 80%; max-width: 400px; text-align: center; margin-top: 100px;">
            <img id="qrImage" style="width: 100%; background-color: white; padding: 10px;">
            <p style="color: white; margin-top: 10px;">Scan this QR code with your WireGuard app</p>
        </div>
    </div>

    <script>
        // Dropdown toggle logic
        document.addEventListener('click', function(event) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                dropdowns[i].style.display = 'none';
            }
            if (event.target.matches('.dropdown button')) {
                event.target.nextElementSibling.style.display = 'block';
                event.stopPropagation();
            }
        });

        function showQRCode(id) {
            var modal = document.getElementById("qrModal");
            var img = document.getElementById("qrImage");
            img.src = "/device/qrcode/" + id;
            modal.style.display = "block";
        }

        function closeModal() {
            document.getElementById("qrModal").style.display = "none";
        }
    </script>
    
    <form th:action="@{/logout}" method="post" style="margin-top: 2rem;">
        <button type="submit" class="btn-pill" style="background: #ff4d4d; color: white; width: auto; padding: 0.8rem 1.5rem;">
            Logout
        </button>
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="centered-body">

<div class="container">
    <h1 th:text="${user.id == null ? 'Create User' : 'Edit User'}"></h1>
    
    <form th:action="@{/user/save}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}" />
        
        <div class="form-group">
            <label>Login:</label>
            <input type="text" th:field="*{login}" required />
        </div>
        
        <div class="form-group">
            <label>Password:</label>
            <input type="password" th:field="*{passwd}" th:required="${user.id == null}" />
            <small th:if="${user.id != null}" style="display: block; margin-top: 0.25rem;">Leave blank to keep current password</small>
        </div>
        
        <div class="form-group">
            <label>Role:</label>
            <select th:field="*{authRole}">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
        
        <div class="form-group">
            <div class="checkbox-group">
                <input type="checkbox" th:field="*{enabled}" id="enabled" />
                <label for="enabled">Enabled</label>
            </div>
        </div>

        <div class="form-group">
            <label>Permissions:</label>
            <div th:each="perm : ${allPermissions}" class="checkbox-group">
                <input type="checkbox" th:field="*{permissions}" th:value="${perm.id}" th:id="${'perm-' + perm.id}" />
                <label th:for="${'perm-' + perm.id}" th:text="${perm.displayName}"></label>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn-pill" style="background: #4CAF50; color: white;">Save</button>
            <a th:href="@{/main}" class="btn-pill" style="background: #ccc; color: black; text-decoration: none; text-align: center;">Cancel</a>
        </div>
    </form>

    <div th:if="${user.id != null}" style="margin-top: 2rem; border-top: 1px solid #ccc; padding-top: 2rem;">
        <h3>Reset Password</h3>
        <form th:action="@{'/user/reset-password/' + ${user.id}}" method="post">
            <button type="submit" class="btn-pill" style="background: #f44336; color: white;">Reset password</button>
        </form>
        <div th:if="${resetToken}" style="margin-top: 1rem;">
            <p>Generated Reset Password Link (valid for 24 hours):</p>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <input type="text" th:value="${(baseUrl ?: '') + '/reset-password?token=' + resetToken}" 
                       id="resetLink" readonly style="flex-grow: 1;"/>
                <button onclick="copyLink()" class="btn-pill" style="background: #2196F3; color: white;">Copy</button>
            </div>
            <script>
                function copyLink() {
                    var copyText = document.getElementById("resetLink");
                    copyText.select();
                    copyText.setSelectionRange(0, 99999);
                    navigator.clipboard.writeText(copyText.value);
                    alert("Link copied to clipboard");
                }
            </script>
        </div>
    </div>
</div>

</body>
</html>
